[project]
name = "us-futures"
version = "0.1.0"
description = "US Futures Quantitative Trading System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.10",
    "duckdb>=1.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "numba>=0.59",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightning>=2.4",
    "torch>=2.4",
    "vectorbt>=0.27",
    "backtesting>=0.3",
    "tqdm>=4.66",
    "rich>=13.7",
    "loguru>=0.7",
    "python-json-logger>=2.0",
    "apscheduler>=3.10",
    "tenacity>=8.5",
    "httpx>=0.27",
    "aiofiles>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
dl = [
    "torchvision>=0.19",
    "torchaudio>=2.4",
    "einops>=0.8",
    "timm>=1.0",
    "transformers>=4.42",
]
rl = [
    "stable-baselines3>=2.5",
    "gymnasium>=0.29",
    "shimmy>=2.1",
    "tianshou>=1.1",
]
live = [
    "ib-insync>=0.9",
    "redis>=5.0",
    "prometheus-client>=0.19",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "ARG", "PTH", "PD", "PER", "RUF", "SIM", "T20", "TRY", "NPY"]
ignore = ["ANN101", "ARG001", "ARG002", "B008", "C408", "PD901", "PTH123", "RUF012", "T201", "T203"]
fixable = ["F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
unsafe-fixes = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_equality = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "requires_data: marks tests as requiring data files",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["us_futures*"]

[tool.coverage.run]
source = ["us_futures"]
omit = ["tests/*", "scripts/*", "notebooks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]