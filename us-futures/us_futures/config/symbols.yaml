# Month code mapping (CME standard)
month_codes:
  1: "F"   # January
  2: "G"   # February
  3: "H"   # March
  4: "J"   # April
  5: "K"   # May
  6: "M"   # June
  7: "N"   # July
  8: "Q"   # August
  9: "U"   # September
  10: "V"  # October
  11: "X"  # November
  12: "Z"  # December

# Contract code format: {SYMBOL}{MONTH_CODE}{YEAR_LAST_DIGIT}
# Example: ESU24 = E-mini S&P 500 Sep 2024
# Continuous contracts: ES1! (front month), ES2! (second month), etc.