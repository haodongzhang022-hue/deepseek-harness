# US Futures Contract Specifications
# All values per CME Group specifications
# tick_size: minimum price increment
# tick_value: dollar value per tick per contract
# margin_initial: initial margin requirement (approximate, varies by broker)
# margin_maintenance: maintenance margin
# trading_hours: reference to sessions in settings.yaml
# roll_rule: how to roll contracts (volume, oi, date, custom)
# roll_offset_days: days before expiration to start roll
# multiplier: contract multiplier (point value)
# exchange: CME, CBOT, NYMEX, COMEX
# sector: equity, energy, metal, treasury, fx, ag, livestock
# timezone: contract trading timezone

